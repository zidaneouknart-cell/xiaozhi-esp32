name: Build Custom Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix Manifest & Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # تنظيف التبعية المسببة للخطأ في التحليل
          git checkout main/idf_component.yml 2>/dev/null || true
          sed -i '/^dependencies:/,$d' main/idf_component.yml 2>/dev/null || true
          
          # إعداد البوردة والبناء
          cp sdkconfig.defaults.esp32s3 sdkconfig
          echo "CONFIG_BOARD_BREAD_COMPACT_WIFI_LCD=y" >> sdkconfig
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/xiaozhi.bin
            build/merged-binary.bin
